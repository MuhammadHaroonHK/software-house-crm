services:
  postgres:
    image: postgres:16-alpine
    container_name: crm-postgres

    environment:
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
      POSTGRES_DB: software_house_crm

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d software_house_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: crm-server

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NODE_ENV: development

      DATABASE_URL: postgresql://crm_user:crm_password@postgres:5432/software_house_crm
      DIRECT_DATABASE_URL: postgresql://crm_user:crm_password@postgres:5432/software_house_crm

      JWT_ACCESS_SECRET: docker-learning-access-secret
      JWT_REFRESH_SECRET: docker-learning-refresh-secret

      CLOUDINARY_CLOUD_NAME: ""
      CLOUDINARY_API_KEY: ""
      CLOUDINARY_API_SECRET: ""

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: